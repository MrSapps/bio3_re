      - [0x6A6C0, c, game/80079EC0]
      # Sony PsyQ libraries (libspu, libgte, libgpu, libcd, libapi, libc, ...)
      - [0x6D7C8, asm, psyq]
      - [0x84E80, data, data]          # .data / .sdata / .bss-with-init (to be split)
      - [0xAA5E8, data, zero_bss]      # crt0-cleared region, kept in-file for a byte match
  - [0xD4000]
